[project]
name = "people-gator-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marek Vaško", email = "ivasko@fit.vutbr.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiobotocore>=2.25.1",
    "aiodns>=4.0.0",
    "aiohttp>=3.13.5",
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.8",
    "fastapi[standard]>=0.136.1",
    "fsspec>=2026.7.0",
    "joserfc>=1.6.4",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.62b0",
    "opentelemetry-instrumentation-asgi>=0.62b0",
    "opentelemetry-instrumentation-asyncio>=0.62b0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "opentelemetry-instrumentation-redis>=0.62b0",
    "opentelemetry-instrumentation-system-metrics>=0.62b0",
    "opentelemetry-instrumentation-weaviate>=0.60.0",
    "opentelemetry-sdk>=1.41.0",
    "pillow>=12.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.26",
    "s3fs>=2026.7.0",
    "structlog>=25.5.0",
    "types-aioboto3>=15.5.0",
    "types-aiobotocore[s3]>=3.7.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.46.0",
    "weaviate-client>=4.21.2",
]

[project.scripts]
people-gator-api = "people_gator_api.cli.server:server"
people-gator-init-db = "people_gator_api.cli.server:init_db"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "ipykernel>=7.2.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
