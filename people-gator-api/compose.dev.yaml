services:
  people-gator-keycloak-dev:
    image: quay.io/keycloak/keycloak:26.6
    restart: unless-stopped
    command: start-dev
    depends_on:
      people-gator-postgres-dev:
        condition: service_healthy
      people-gator-db-init-dev:
        condition: service_completed_successfully
    env_file: .env
    labels:
      traefik.enable: true
      traefik.http.routers.people-gator-keycloak-dev.rule: Host(`auth.dev.people-gator.capturemyhand.com`)
      traefik.http.routers.people-gator-keycloak-dev.entrypoints: websecure
      traefik.http.services.people-gator-keycloak-dev.loadbalancer.server.port: 8080
      traefik.http.routers.people-gator-keycloak-dev.tls: true
      traefik.http.routers.people-gator-keycloak-dev.tls.certresolver: tlschallenge
    networks:
      - web
      - logging
      - default

  people-gator-postgres-dev:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/hdd/Data/people-gator-dev/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  people-gator-db-init-dev:
    image: postgres:18
    restart: "no"
    depends_on:
      people-gator-postgres-dev:
        condition: service_healthy
    env_file: .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -h people-gator-postgres-dev -p 5432 -U $$POSTGRES_USER; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        PGPASSWORD=$$POSTGRES_PASSWORD psql -h people-gator-postgres-dev -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE keycloak;" || true
        PGPASSWORD=$$POSTGRES_PASSWORD psql -h people-gator-postgres-dev -U $$POSTGRES_USER -d postgres -c "CREATE DATABASE people_gator;" || true
    networks:
      - default

  people-gator-pgadmin-dev:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    depends_on:
      - people-gator-postgres-dev
    env_file: .env
    volumes:
      - /mnt/hdd/Data/people-gator-dev/pgadmin:/var/lib/pgadmin
    networks:
      - default
      - web
    user: root
    labels:
      traefik.enable: true
      traefik.http.routers.people-gator-pgadmin-dev.rule: Host(`pgadmin.dev.people-gator.capturemyhand.com`)
      traefik.http.routers.people-gator-pgadmin-dev.entrypoints: websecure
      traefik.http.services.people-gator-pgadmin-dev.loadbalancer.server.port: 80
      traefik.http.routers.people-gator-pgadmin-dev.tls: true
      traefik.http.routers.people-gator-pgadmin-dev.tls.certresolver: tlschallenge

  people-gator-weaviate-dev:
    image: semitechnologies/weaviate:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/hdd/Data/people-gator-dev/weaviate:/var/lib/weaviate
    networks:
      - default
  people-gator-api-dev:
    image: people-gator-api-dev:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    depends_on:
      people-gator-postgres-dev:
        condition: service_healthy
      people-gator-db-init-dev:
        condition: service_completed_successfully
      people-gator-keycloak-dev:
        condition: service_started
    ports:
      - 5679:5678 # debugger
    user: root
    env_file: .env
    develop:
      # Create a `watch` configuration to update the app
      #
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment
          ignore:
            - .venv/
            - docs/
            - .github/
            - .vscode/
            - .git/
        # Rebuild the image on changes to the `pyproject.toml`
        - action: rebuild
          path: ./pyproject.toml
        # rebuild the image on changes to the `Dockerfile.dev`
        - action: rebuild
          path: ./Dockerfile.dev
    labels:
      traefik.enable: true
      traefik.http.routers.people-gator-api-dev.rule: Host(`dev.people-gator.capturemyhand.com`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`))
      traefik.http.routers.people-gator-api-dev.entrypoints: websecure
      traefik.http.services.people-gator-api-dev.loadbalancer.server.port: 8000
      traefik.http.routers.people-gator-api-dev.tls: true
      traefik.http.routers.people-gator-api-dev.tls.certresolver: tlschallenge
    networks:
      - web
      - default
      - logging

networks:
  web:
    external: true
  logging:
    external: true

