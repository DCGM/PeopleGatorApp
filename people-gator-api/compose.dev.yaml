# Load the same values for Compose interpolation and container environments:
# docker compose --env-file example.env -f compose.dev.yaml up -d --build
services:
  people-gator-postgres-dev:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: example.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the --env-file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the --env-file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the --env-file}
    volumes:
      - people-gator-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 1s
    networks:
      - default

  people-gator-api-dev:
    image: people-gator-api-dev:latest
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    depends_on:
      people-gator-postgres-dev:
        condition: service_healthy
    ports:
      - 8000:8000 # API
    volumes:
      - people-gator-api-dev-data:/data
    env_file: example.env
    environment:
      ## Env variables for persistance ie PostgreSQL connection details
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__HOST: people-gator-postgres-dev
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PORT: 5432
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__USER: ${POSTGRES_USER:?Set POSTGRES_USER in the --env-file}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the --env-file}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the --env-file}
      ## Env variables for Storage configuration, local file system
      PEOPLE_GATOR_API__STORAGE__LOCAL__PATH: /data
      ## Env variables for OpenRouter configuration
      PEOPLE_GATOR_API__OPENROUTER__API_KEY: ${OPENROUTER_API_KEY:-}
      PEOPLE_GATOR_API__OPENROUTER__MODEL: deepseek/deepseek-v4-flash
      ## Env variables for API configuration
      PEOPLE_GATOR_API__PORT: 8000
      PEOPLE_GATOR_API__HOST: "0.0.0.0"
      PEOPLE_GATOR_API__DEBUG: true
      PEOPLE_GATOR_API__RELOAD: true
      # Logs
      PEOPLE_GATOR_API__LOG_LEVEL: ${PEOPLE_GATOR_API__LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 32
      start_period: 0s
    develop:
      # Create a `watch` configuration to update the app
      #
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment
          ignore:
            - .venv/
            - docs/
            - .github/
            - .vscode/
            - .git/
        # Rebuild the image on changes to the `pyproject.toml`
        - action: rebuild
          path: ./pyproject.toml
        # rebuild the image on changes to the `Dockerfile.dev`
        - action: rebuild
          path: ./Dockerfile.dev
    networks:
      - default


volumes:
  people-gator-postgres-dev-data:
  people-gator-api-dev-data:
