name: people-gator-dev

# Start with: docker compose -f compose.dev.yaml up --build --watch
# HTTP_HOST selects the routed hostname (default: localhost).
# PUBLIC_ORIGIN optionally overrides the browser-facing URL, e.g. for HTTPS.
services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - '--providers.docker.constraints=Label(`com.docker.compose.project`, `${COMPOSE_PROJECT_NAME:-people-gator-dev}`)'
      - --ping=true
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # Rootless Docker socket; DOCKER_SOCKET can override a custom location.
      - ${DOCKER_SOCKET:-${XDG_RUNTIME_DIR:-/run/user/1000}/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-people_gator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-people_gator}
      POSTGRES_DB: ${POSTGRES_DB:-people_gator}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: ./people-gator-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PEOPLE_GATOR_API__HOST: "0.0.0.0"
      PEOPLE_GATOR_API__PORT: "8000"
      PEOPLE_GATOR_API__DEBUG: "true"
      PEOPLE_GATOR_API__RELOAD: "true"
      PEOPLE_GATOR_API__LOG_LEVEL: ${PEOPLE_GATOR_API__LOG_LEVEL:-info}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__HOST: db
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PORT: "5432"
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__USER: ${POSTGRES_USER:-people_gator}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-people_gator}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ${POSTGRES_DB:-people_gator}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__SCHEMA_MODE: bootstrap
      PEOPLE_GATOR_API__STORAGE__LOCAL__ROOT: /data
      PEOPLE_GATOR_API__CORS__ALLOW_ORIGIN_REGEX: ""
      PEOPLE_GATOR_API__CORS__ALLOW_ORIGINS: '["${PUBLIC_ORIGIN:-http://${HTTP_HOST:-localhost}:${HTTP_PORT:-8080}}"]'
      PEOPLE_GATOR_API__AUTH__ISSUER: ${PUBLIC_ORIGIN:-http://${HTTP_HOST:-localhost}:${HTTP_PORT:-8080}}
      PEOPLE_GATOR_API__AUTH__AUDIENCE: ${HTTP_HOST:-localhost}
      PEOPLE_GATOR_API__API_KEYS__IDENTITY_ISSUER: ${PUBLIC_ORIGIN:-http://${HTTP_HOST:-localhost}:${HTTP_PORT:-8080}}
      PEOPLE_GATOR_API__AUTH__JWKS_URL: http://auth:8002/.well-known/jwks.json
      PEOPLE_GATOR_API__OPENROUTER__API_KEY: ${OPENROUTER_API_KEY:-}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    develop:
      watch:
        - path: ./people-gator-api
          action: sync
          target: /app
          initial_sync: true
          ignore:
            # .dockerignore supplies cache, virtualenv, and local-file exclusions.
            # Build inputs have separate rebuild rules.
            - pyproject.toml
            - uv.lock
            - .python-version
            - Dockerfile.dev
            - Dockerfile
            - .dockerignore
            - compose*.yaml
            # This file is already bind-mounted at the auth storage path.
            - example.users.json
        - path: ./people-gator-api/pyproject.toml
          action: rebuild
        - path: ./people-gator-api/uv.lock
          action: rebuild
        - path: ./people-gator-api/.python-version
          action: rebuild
        - path: ./people-gator-api/Dockerfile.dev
          action: rebuild
        - path: ./people-gator-api/.dockerignore
          action: rebuild
    labels:
      traefik.enable: "true"
      traefik.http.routers.people-gator-dev-api.entrypoints: web
      traefik.http.routers.people-gator-dev-api.rule: 'Host(`${HTTP_HOST:-localhost}`) && ( PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`) )'
      traefik.http.routers.people-gator-dev-api.priority: "100"
      traefik.http.routers.people-gator-dev-api.service: people-gator-dev-api
      traefik.http.services.people-gator-dev-api.loadbalancer.server.port: "8000"

  auth-provision:
    build:
      context: ./people-gator-api
      dockerfile: Dockerfile.dev
    profiles: [tools]
    command: [uv, run, people-gator-auth-provision, /users.json]
    env_file: .env
    environment:
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__HOST: db
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PORT: '5432'
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__USER: ${POSTGRES_USER:-people_gator}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:-people_gator}
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ${POSTGRES_DB:-people_gator}
      PEOPLE_GATOR_API__STORAGE__LOCAL__ROOT: /tmp/provision
      PEOPLE_GATOR_AUTH__STATE_DIR: /auth
      PEOPLE_GATOR_AUTH__ISSUER: ${PUBLIC_ORIGIN:-http://${HTTP_HOST:-localhost}:${HTTP_PORT:-8080}}
      PEOPLE_GATOR_AUTH__AUDIENCE: ${HTTP_HOST:-localhost}
    volumes:
      - auth-data:/auth
      - ./people-gator-api/example.users.json:/users.json:ro

  auth:
    build:
      context: ./people-gator-api
      dockerfile: Dockerfile.dev
    command: [uv, run, people-gator-auth]
    restart: unless-stopped
    environment:
      PEOPLE_GATOR_AUTH__STATE_DIR: /auth
      PEOPLE_GATOR_AUTH__ISSUER: ${PUBLIC_ORIGIN:-http://${HTTP_HOST:-localhost}:${HTTP_PORT:-8080}}
      PEOPLE_GATOR_AUTH__AUDIENCE: ${HTTP_HOST:-localhost}
    volumes: [auth-data:/auth]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/auth/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    labels:
      traefik.enable: 'true'
      traefik.http.routers.people-gator-dev-auth.entrypoints: web
      traefik.http.routers.people-gator-dev-auth.rule: 'Host(`${HTTP_HOST:-localhost}`) && (PathPrefix(`/token/`) || PathPrefix(`/.well-known/`) || Path(`/auth/health`))'
      traefik.http.routers.people-gator-dev-auth.priority: '110'
      traefik.http.services.people-gator-dev-auth.loadbalancer.server.port: '8002'

  frontend:
    build:
      context: ./people-gator-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      ALLOWED_VITE_HOSTS: ${HTTP_HOST:-localhost}
      VITE_API_BASE_URL: ${HTTP_API_BASE_URL:-http://localhost:8080}
      VITE_AUTH_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    develop:
      watch:
        - path: ./people-gator-app
          action: sync
          target: /app
          initial_sync: true
          ignore:
            # .dockerignore also excludes dependencies and generated/local files.
            # Build inputs must only trigger rebuilds, never source synchronization.
            - package.json
            - package-lock.json
            - Dockerfile.dev
            - .dockerignore
            - compose*.yaml
        - path: ./people-gator-app/package.json
          action: rebuild
        - path: ./people-gator-app/package-lock.json
          action: rebuild
        - path: ./people-gator-app/Dockerfile.dev
          action: rebuild
        - path: ./people-gator-app/.dockerignore
          action: rebuild
    labels:
      traefik.enable: "true"
      traefik.http.routers.people-gator-dev-app.entrypoints: web
      traefik.http.routers.people-gator-dev-app.rule: 'Host(`${HTTP_HOST:-localhost}`)'
      traefik.http.routers.people-gator-dev-app.priority: "10"
      traefik.http.routers.people-gator-dev-app.service: people-gator-dev-app
      traefik.http.services.people-gator-dev-app.loadbalancer.server.port: "8080"

volumes:
  postgres-data:
  api-data:
  auth-data:
