[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "people-gator-deploy"
version = "1.0.1"
description = "Trusted PeopleGator deployment lifecycles"
requires-python = ">=3.11"
# Pin the complete small S3 client dependency set, matching the backend lock.
dependencies = [
  "boto3==1.40.61", "botocore==1.40.61", "jmespath==1.1.0",
  "python-dateutil==2.9.0.post0", "s3transfer==0.14.0", "six==1.17.0",
  "urllib3==2.6.3",
]

[project.scripts]
people-gator-deploy = "people_gator_deploy.cli:main"

[tool.setuptools.package-data]
people_gator_deploy = ["assets/*", "build.json"]
