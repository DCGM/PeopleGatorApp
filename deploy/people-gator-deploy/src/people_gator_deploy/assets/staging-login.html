<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in to staging | People Gator</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; }
    main { max-width: 420px; margin: 8vh auto; }
    h1 { font-size: 1.6rem; }
    p { line-height: 1.6; }
    form { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
    button { margin-top: 12px; cursor: pointer; }
    #status { min-height: 3em; }
  </style>
</head>
<body>
<main>
  <p>People Gator · Staging</p>
  <h1>Sign in to staging</h1>
  <p>Use the private credentials supplied by your staging administrator. Changes made here stay in staging.</p>
  <form>
    <label for="username">Account</label>
    <select id="username" name="username" autocomplete="username">
      <option value="staging-viewer">staging-viewer</option>
      <option value="staging-annotator">staging-annotator</option>
      <option value="staging-importer">staging-importer</option>
      <option value="staging-admin">staging-admin</option>
    </select>
    <p id="permissions">Permissions: browse</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
  const scopes = {
    'staging-viewer': ['browse'],
    'staging-annotator': ['browse', 'annotate'],
    'staging-importer': ['browse', 'ingest'],
    'staging-admin': ['browse', 'annotate', 'ingest', 'admin'],
  };
  const form = document.querySelector('form');
  const account = document.querySelector('#username');
  const password = document.querySelector('#password');
  const button = document.querySelector('button');
  const status = document.querySelector('#status');
  account.addEventListener('change', () => {
    document.querySelector('#permissions').textContent = 'Permissions: ' + scopes[account.value].join(', ');
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = 'Signing in…';
    try {
      const response = await fetch('/token/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ username: account.value, password: password.value,
          scope: scopes[account.value].map((value) => 'people-gator:' + value).join(' ') }),
        cache: 'no-store',
      });
      if (!response.ok) throw new Error('Sign-in failed');
      const tokens = await response.json();
      if (!tokens.access_token || !tokens.refresh_token) throw new Error('Missing session');
      sessionStorage.setItem('people-gator.access-token', tokens.access_token);
      sessionStorage.setItem('people-gator.refresh-token', tokens.refresh_token);
      password.value = '';
      location.assign('/');
    } catch {
      status.textContent = 'Unable to sign in. Check your account credentials and permissions, then try again.';
      button.disabled = false;
      password.focus();
    }
  });
</script>
</body>
</html>
