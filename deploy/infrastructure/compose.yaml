# Shared infrastructure of a deploy host (previews and staging, or production):
# PostgreSQL on the `db` network and an HTTPS-only Traefik on the `web` network.
# Start it once as the deployment account and leave it running; the deploy jobs
# only check it.
#
# As the deployment account, from anywhere (safe to rerun: it refreshes
# compose.yaml and the examples in ~/peoplegator-infra from the repository, and
# creates infra.env with a generated password and traefik.yaml only once; edit
# those two there and rerun to apply changes):
#
#   ref=main; d=~/peoplegator-infra; t=$(mktemp -d) && git clone -q --depth 1 --branch $ref https://github.com/DCGM/PeopleGatorApp.git $t && install -d -m 700 $d && cp $t/deploy/infrastructure/compose.yaml $t/deploy/infrastructure/example.env $t/deploy/infrastructure/traefik.example.yaml $d/ && rm -rf $t && { [ -f $d/infra.env ] || sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" -e "s|^TRAEFIK_CONFIG=.*|TRAEFIK_CONFIG=$d/traefik.yaml|" -e "s|^DOCKER_SOCKET=.*|DOCKER_SOCKET=$(docker context inspect -f "{{.Endpoints.docker.Host}}" | sed "s|^unix://||")|" $d/example.env > $d/infra.env; } && chmod 600 $d/infra.env && { [ -f $d/traefik.yaml ] || cp $d/traefik.example.yaml $d/traefik.yaml; } && docker compose -f $d/compose.yaml --env-file $d/infra.env up -d --wait --remove-orphans
#
# The admin URL for PREVIEW_DATABASE_URL / STAGING_DATABASE_URL is then
# postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/postgres
name: peoplegator-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    # No published port: only containers on the db network reach PostgreSQL.

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    # All settings live in traefik.yaml (copy traefik.example.yaml): HTTPS-only
    # `websecure` entry point, Docker provider and the ACME resolver.
    command: [--configfile=/etc/traefik/traefik.yaml]
    ports:
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Rootless Docker: DOCKER_SOCKET=$XDG_RUNTIME_DIR/docker.sock in the env file.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG:?set TRAEFIK_CONFIG to your traefik.yaml}:/etc/traefik/traefik.yaml:ro
      - traefik-acme:/acme
    networks: [web]

volumes:
  postgres-data:
  traefik-acme:

networks:
  db:
    name: db
    internal: true
  web:
    name: web
