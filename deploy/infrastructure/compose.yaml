# Shared infrastructure of a deploy host (previews and staging, or production):
# PostgreSQL on the `db` network and an HTTPS-only Traefik on the `web` network.
# Start it once as the deployment account and leave it running; the deploy jobs
# only check it.
#
#   cp deploy/infrastructure/example.env /private/infrastructure.env        # password, port, paths
#   cp deploy/infrastructure/traefik.example.yaml /private/traefik.yaml     # ACME e-mail
#   docker compose -f deploy/infrastructure/compose.yaml --env-file /private/infrastructure.env up -d --wait --remove-orphans
#
# The admin URL for PREVIEW_DATABASE_URL / STAGING_DATABASE_URL is then
# postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/postgres
name: people-gator-preview-infra  # kept from earlier releases so existing volumes match

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      db:
        # preview-postgres keeps stacks deployed before this layout working.
        aliases: [postgres, preview-postgres]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    # No published port: only containers on the db network reach PostgreSQL.

  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    # All settings live in traefik.yaml (copy traefik.example.yaml): HTTPS-only
    # `websecure` entry point, Docker provider and the ACME resolver.
    command: [--configfile=/etc/traefik/traefik.yaml]
    ports:
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Rootless Docker: DOCKER_SOCKET=$XDG_RUNTIME_DIR/docker.sock in the env file.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG:?set TRAEFIK_CONFIG to your traefik.yaml}:/etc/traefik/traefik.yaml:ro
      - traefik-acme:/acme
    networks: [web]

volumes:
  postgres-data:
  traefik-acme:

networks:
  db:
    name: db
    internal: true
  web:
    name: web
