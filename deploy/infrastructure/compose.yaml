# Shared PostgreSQL and pgAdmin for PR previews and staging (deploy/GITHUB-SETUP.md).
# An operator runs this stack once per host and keeps it running; the deploy
# jobs only check it (see deploy/people-gator-deploy/HOSTS.md):
#
#   docker compose -f deploy/infrastructure/compose.yaml --env-file /private/infrastructure.env up -d --wait --remove-orphans
#
# The project name is kept from earlier releases so existing volumes match.
name: people-gator-preview-infra

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Reachable as people-gator-postgres on the people-gator-db network; the
    # deploy utility provisions per-PR and staging databases through the admin
    # URL in PREVIEW_CONFIG / STAGING_CONFIG.
    container_name: people-gator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: preview_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      database:
        aliases: [preview-postgres]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U preview_admin -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    # PostgreSQL has no published host port and never joins Traefik's network.

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@peoplegator.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?required}
      PGADMIN_DISABLE_POSTFIX: '1'
      PGADMIN_LISTEN_PORT: '5050'
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: '1'
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: '1'
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: 'True'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks: [database, web]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.pg-preview-pgadmin.entrypoints=websecure
      - 'traefik.http.routers.pg-preview-pgadmin.rule=Host(`${PGADMIN_HOST:-pgadmin-preview.peoplegator.dev}`)'
      - traefik.http.routers.pg-preview-pgadmin.service=pg-preview-pgadmin
      - traefik.http.routers.pg-preview-pgadmin.tls=true
      - traefik.http.routers.pg-preview-pgadmin.tls.certresolver=tlschallenge
      - traefik.http.services.pg-preview-pgadmin.loadbalancer.server.port=5050

volumes:
  pgadmin-data:
  postgres-data:

networks:
  database:
    name: people-gator-db
    internal: true
  web:
    external: true
    name: web
