# Each PR has frontend/backend containers and storage, but no database container.
x-preview-labels: &preview-labels
  people-gator.preview.pr: ${PR_NUMBER:?required}
  people-gator.preview.sha: ${COMMIT_SHA:-unknown}

# Docker sends stdout/stderr, including one-off migration and seed logs, to the host collector.
# The driver connects from the Docker daemon, not from the container's network.
x-preview-logging: &preview-logging
  driver: fluentd
  options:
    fluentd-address: ${PREVIEW_LOG_ADDRESS:-127.0.0.1:24224}
    fluentd-async: 'true'
    fluentd-buffer-limit: '8192'
    fluentd-sub-second-precision: 'true'
    fluentd-write-timeout: '3s'
    labels: people-gator.preview.pr,people-gator.preview.sha,com.docker.compose.service
    tag: people-gator.preview
    cache-max-size: 10m
    cache-max-file: '3'

x-backend: &backend
  image: ${BACKEND_IMAGE:?required}
  logging: *preview-logging
  labels: *preview-labels
  user: '10001:10001'
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=128m,mode=1777']
  mem_limit: 2g
  pids_limit: 256
  environment:
    PEOPLE_GATOR_API__HOST: 0.0.0.0
    PEOPLE_GATOR_API__PORT: '8000'
    PEOPLE_GATOR_API__DEBUG: 'false'
    PEOPLE_GATOR_API__RELOAD: 'false'
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__HOST: preview-postgres
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PORT: '5432'
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__USER: ${DB_USER:?required}
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PASSWORD: ${DB_PASSWORD:?required}
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ${DB_NAME:?required}
    PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__SCHEMA_MODE: validate
    PEOPLE_GATOR_API__STORAGE__LOCAL__ROOT: /data
    PEOPLE_GATOR_API__JWK__USERS_PATH: peoplegator_api/users.json
    PEOPLE_GATOR_API__JWK__ISSUER: https://${PREVIEW_HOST:?required}
    PEOPLE_GATOR_API__JWK__AUDIENCE: ${PREVIEW_HOST:?required}
    PEOPLE_GATOR_API__CORS__ALLOW_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:?required}
  volumes:
    - api-data:/data
    - ${USERS_FILE:?required}:/data/peoplegator_api/users.json:ro
  networks: [database]

services:
  storage-init:
    image: ${BACKEND_IMAGE:?required}
    profiles: [tools]
    logging: *preview-logging
    labels: *preview-labels
    user: '0:0'
    entrypoint: [python, -c]
    command:
      - "import os; os.makedirs('/data/peoplegator_api', exist_ok=True); os.chown('/data', 10001, 10001); os.chown('/data/peoplegator_api', 10001, 10001)"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes: [api-data:/data]

  migrate:
    <<: *backend
    profiles: [tools]
    command: [migrate]

  seed:
    <<: *backend
    profiles: [tools]
    command: [seed]

  backend:
    <<: *backend
    restart: unless-stopped
    command: [api]
    networks: [database, web]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - people-gator.preview.pr=${PR_NUMBER:?required}
      - people-gator.preview.sha=${COMMIT_SHA:-unknown}
      - traefik.enable=true
      - traefik.docker.network=${WEB_NETWORK:-web}
      - traefik.http.routers.pg-pr-${PR_NUMBER}-api.entrypoints=websecure
      - 'traefik.http.routers.pg-pr-${PR_NUMBER}-api.rule=Host(`${PREVIEW_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`) || PathPrefix(`/.well-known/`) || PathPrefix(`/token/`))'
      - traefik.http.routers.pg-pr-${PR_NUMBER}-api.priority=100
      - traefik.http.routers.pg-pr-${PR_NUMBER}-api.service=pg-pr-${PR_NUMBER}-api
      - traefik.http.routers.pg-pr-${PR_NUMBER}-api.tls=true
      - traefik.http.routers.pg-pr-${PR_NUMBER}-api.tls.certresolver=${CERTIFICATE_RESOLVER-tlschallenge}
      - traefik.http.services.pg-pr-${PR_NUMBER}-api.loadbalancer.server.port=8000

  frontend:
    image: ${FRONTEND_IMAGE:?required}
    logging: *preview-logging
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]
    labels:
      - people-gator.preview.pr=${PR_NUMBER:?required}
      - people-gator.preview.sha=${COMMIT_SHA:-unknown}
      - traefik.enable=true
      - traefik.docker.network=${WEB_NETWORK:-web}
      - traefik.http.routers.pg-pr-${PR_NUMBER}-app.entrypoints=websecure
      - 'traefik.http.routers.pg-pr-${PR_NUMBER}-app.rule=Host(`${PREVIEW_HOST}`)'
      - traefik.http.routers.pg-pr-${PR_NUMBER}-app.priority=10
      - traefik.http.routers.pg-pr-${PR_NUMBER}-app.service=pg-pr-${PR_NUMBER}-app
      - traefik.http.routers.pg-pr-${PR_NUMBER}-app.tls=true
      - traefik.http.routers.pg-pr-${PR_NUMBER}-app.tls.certresolver=${CERTIFICATE_RESOLVER-tlschallenge}
      - traefik.http.services.pg-pr-${PR_NUMBER}-app.loadbalancer.server.port=8080

volumes:
  api-data:

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:-people-gator-preview-db}
  web:
    external: true
    name: ${WEB_NETWORK:-web}
