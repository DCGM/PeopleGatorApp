name: PR preview lifecycle

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

# Serialize deployment, closure and reconciliation, without cancelling cleanup.
concurrency:
  group: people-gator-preview-host
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, people-gator-preview]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREVIEW_CONFIG: /opt/people-gator-preview/config.json
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Only the reviewed workflow revision is read here, never the PR head.
      # The controller and Compose files still require an operator installation.
      - name: Read trusted preview deployment requirements
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .preview-workflow
          sparse-checkout: deploy/preview
          persist-credentials: false
      - name: Require installed preview seeding before deployment
        if: github.event_name == 'workflow_run'
        run: python3 .preview-workflow/deploy/preview/check_installation.py
      - name: Use temporary registry credentials
        id: registry-config
        if: github.event_name == 'workflow_run'
        run: |
          preview_context="$(docker context show)"
          registry_config="$(mktemp -d "$RUNNER_TEMP/people-gator-preview-docker.XXXXXX")"
          echo "path=$registry_config" >> "$GITHUB_OUTPUT"
          # Registry credentials and daemon contexts both live under DOCKER_CONFIG.
          # Preserve only the selected context, without copying existing logins.
          if [ "$preview_context" != default ]; then
            docker context export "$preview_context" "$registry_config/context.dockercontext"
            DOCKER_CONFIG="$registry_config" docker context import "$preview_context" "$registry_config/context.dockercontext"
            rm -- "$registry_config/context.dockercontext"
          fi
          DOCKER_CONFIG="$registry_config" docker context use "$preview_context"
          echo "DOCKER_CONFIG=$registry_config" >> "$GITHUB_ENV"
      - name: Check deployment Docker daemon
        run: |
          docker info --format 'Docker daemon: {{.Name}}'
      - name: Log into image registry
        if: github.event_name == 'workflow_run'
        env:
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Apply preview lifecycle
        run: |
          case "$EVENT_NAME" in
            workflow_run)
              python3 /opt/people-gator-preview/preview.py deploy --run-id "$RUN_ID"
              ;;
            pull_request_target)
              python3 /opt/people-gator-preview/preview.py cleanup --pr "$PR_NUMBER"
              ;;
            schedule|workflow_dispatch)
              python3 /opt/people-gator-preview/preview.py reconcile
              ;;
            *) exit 2 ;;
          esac
      - name: Remove temporary registry credentials
        if: always() && steps.registry-config.outputs.path != ''
        env:
          PREVIEW_DOCKER_CONFIG: ${{ steps.registry-config.outputs.path }}
        run: rm -rf -- "$PREVIEW_DOCKER_CONFIG"
