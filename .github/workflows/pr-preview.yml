name: PR preview lifecycle

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

# Serialize preview deployment, closure and reconciliation, without cancelling cleanup.
concurrency:
  group: people-gator-preview-host
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.workflow_ref == format('{0}/.github/workflows/pr-preview.yml@refs/heads/main', github.repository) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, people-gator-preview]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Only the reviewed workflow revision is read here, never the PR head.
      - name: Read trusted deployment utility
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-controller
          fetch-depth: 0
          sparse-checkout: deploy
          persist-credentials: false
      - name: Select trusted deployment utility
        id: utility
        run: python3 .deploy-controller/deploy/install.py --user --revision "$GITHUB_WORKFLOW_SHA"
      - name: Check preview configuration and prerequisites
        env:
          DEPLOY: ${{ steps.utility.outputs.executable }}
        run: '"$DEPLOY" pr preflight'
      - name: Apply preview lifecycle
        env:
          DEPLOY: ${{ steps.utility.outputs.executable }}
        run: |
          case "$EVENT_NAME" in
            workflow_run) "$DEPLOY" pr update --run-id "$RUN_ID" ;;
            pull_request_target) "$DEPLOY" pr cleanup --pr "$PR_NUMBER" ;;
            schedule|workflow_dispatch) "$DEPLOY" pr reconcile ;;
            *) exit 2 ;;
          esac
