name: PR CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR code runs only on ephemeral GitHub-hosted runners, never on the
  # self-hosted lifecycle runners that hold deployment state and credentials.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: people-gator-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: people-gator-app/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run type-check
      - run: npm run test:unit -- --run

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__HOST: localhost
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__USER: ci
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PASSWORD: ci
      PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: people-gator-api/uv.lock
      - name: Configure isolated PostgreSQL test port
        env:
          CI_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          {
            echo "PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__PORT=$CI_POSTGRES_PORT"
            echo "PEOPLE_GATOR_POSTGRES_TEST_URL=postgresql+asyncpg://ci:ci@localhost:$CI_POSTGRES_PORT/ci"
            echo "PEOPLE_GATOR_SCHEMA_TEST_URL=postgresql+asyncpg://ci:ci@localhost:$CI_POSTGRES_PORT/ci_schema"
          } >> "$GITHUB_ENV"
      - run: uv sync --locked --python 3.14
        working-directory: people-gator-api
      - name: Create disposable schema and seed databases on the same CI server
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_CONTAINER" psql -U ci -d ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ci_schema' -c 'CREATE DATABASE ci_seed'
      - name: Smoke-test preview migrations and repeatable seeding
        working-directory: people-gator-api
        env:
          PEOPLE_GATOR_API__PERSISTENCE__POSTGRES__DATABASE: ci_seed
        run: |
          seed_storage="$(mktemp -d "$RUNNER_TEMP/people-gator-preview-seed.XXXXXX")"
          trap 'rm -rf -- "$seed_storage"' EXIT
          export PEOPLE_GATOR_API__STORAGE__LOCAL__ROOT="$seed_storage"
          uv run --locked python -m people_gator_api.cli.database migrate
          uv run --locked python -m people_gator_api.cli.seed
          uv run --locked python -m people_gator_api.cli.seed
          uv run --locked python -m people_gator_api.cli.database check
      - run: uv run --locked pytest tests -n 4 --dist=worksteal
        working-directory: people-gator-api
      - name: Exercise isolated database backup publisher and recovery
        env:
          BACKUP_TEST_IMAGE: people-gator-backup-test:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -f deploy/backup/tests/test_roundtrip.py ]; then
            trap 'docker image rm "$BACKUP_TEST_IMAGE" || true' EXIT
            docker build -f deploy/backup/Dockerfile -t "$BACKUP_TEST_IMAGE" .
            people-gator-api/.venv/bin/python deploy/backup/tests/test_roundtrip.py -v
          fi
      - name: Exercise database-only snapshot preservation on synthetic data
        working-directory: people-gator-api
        env:
          STAGING_TEST_DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
          STAGING_TEST_DATABASE_USER: ci
          STAGING_TEST_DATABASE_PASSWORD: ci
          STAGING_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if [ -f ../deploy/people-gator-deploy/tests/test_snapshot.py ]; then
            uv run --locked python ../deploy/people-gator-deploy/tests/test_snapshot.py -v
          fi
      - name: Exercise latest S3 snapshot restore and candidate startup gates
        working-directory: people-gator-api
        env:
          STAGING_TEST_DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
          STAGING_TEST_DATABASE_USER: ci
          STAGING_TEST_DATABASE_PASSWORD: ci
          STAGING_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          STAGING_TEST_NETWORK: people-gator-staging-gate-${{ github.run_id }}-${{ github.run_attempt }}
          STAGING_TEST_IMAGE: people-gator-staging-gate:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          suite=../deploy/people-gator-deploy/tests/test_staging_runtime.py
          if [ -f "$suite" ]; then
            cleanup() {
              docker network disconnect "$STAGING_TEST_NETWORK" "$STAGING_TEST_POSTGRES_CONTAINER" || true
              docker network rm "$STAGING_TEST_NETWORK" || true
              docker image rm "$STAGING_TEST_IMAGE" || true
            }
            trap cleanup EXIT
            docker network create --internal "$STAGING_TEST_NETWORK"
            docker network connect --alias preview-postgres "$STAGING_TEST_NETWORK" "$STAGING_TEST_POSTGRES_CONTAINER"
            docker build -t "$STAGING_TEST_IMAGE" .
            PYTHONPATH=../deploy/people-gator-deploy/src uv run --locked python "$suite" -v
          fi
      # Older PR heads may not contain the deployment utility suite added with this
      # workflow. Keep application checks/builds pinned to the PR head and fetch
      # this suite from the exact workflow commit into a separate checkout.
      - name: Check out deployment utility tests from workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-controller-ci
          # The workflow suite inspects and executes the lifecycle workflow scripts.
          sparse-checkout: |
            deploy
            .github/workflows
          persist-credentials: false
      - name: Test deployment utility
        working-directory: .deploy-controller-ci
        env:
          PREVIEW_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          PYTHONPATH=deploy/people-gator-deploy/src python3 -B -m unittest discover -s deploy/people-gator-deploy/tests -v
      - name: Build and run the deployment utility wheel outside the checkout
        working-directory: .deploy-controller-ci
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/people-gator-deploy wheel.XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          python3 -m venv "$scratch/build env"
          "$scratch/build env/bin/pip" wheel --no-deps -w "$scratch/dist" deploy/people-gator-deploy
          python3 -m venv "$scratch/run env"
          "$scratch/run env/bin/pip" install "$scratch"/dist/people_gator_deploy-*.whl
          cd "$scratch"
          "$scratch/run env/bin/python" -I -B -c 'import boto3; from people_gator_deploy import snapshots'
          "$scratch/run env/bin/people-gator-deploy" --version
          "$scratch/run env/bin/people-gator-deploy" --help >/dev/null

  images:
    needs: [frontend, backend]
    # Forks get tests, but cannot publish images or access the preview host.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: people-gator-app
          - component: backend
            context: people-gator-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log into image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          # Same-origin requests allow the built frontend to work on any PR hostname.
          build-args: VITE_API_BASE_URL=/
          # PR scopes read main's layers but write only their own branch cache.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
