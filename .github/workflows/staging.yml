name: Main staging deployment

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Retain data or explicitly replace the staging database/media from a sanitized snapshot
        type: choice
        options: [deploy, refresh]
        default: deploy
        required: true
      run_id:
        description: Successful current-main PR CI run ID (empty selects latest successful main run)
        type: string
      exact_key:
        description: Optional exact dated backup key within the configured prefix (refresh only)
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

# Serialize deployment, closure and reconciliation, without cancelling cleanup.
concurrency:
  group: people-gator-preview-host
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.workflow_ref == format('{0}/.github/workflows/staging.yml@refs/heads/main', github.repository) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, people-gator-staging]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREVIEW_CONFIG: /opt/people-gator-preview/config.json
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      OPERATION: ${{ inputs.operation || 'deploy' }}
      MANUAL_RUN_ID: ${{ inputs.run_id }}
      EXACT_KEY: ${{ inputs.exact_key }}
    steps:
      # Only the reviewed workflow revision is read here, never the PR head.
      - name: Read trusted staging deployment requirements
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .preview-workflow
          sparse-checkout: deploy/preview
          persist-credentials: false
      - name: Publish reviewed preview controller release
        id: controller-release
        run: python3 .preview-workflow/deploy/preview/release.py --revision "$GITHUB_WORKFLOW_SHA"
      - name: Select preview controller release
        env:
          CONTROLLER_RELEASE: ${{ steps.controller-release.outputs.path }}
        run: echo "PREVIEW_CONTROLLER=$CONTROLLER_RELEASE/staging.py" >> "$GITHUB_ENV"
      - name: Check staging repository and GitHub access
        run: python3 "$PREVIEW_CONTROLLER" check-access
      - name: Use temporary registry credentials
        id: registry-config
        run: |
          preview_context="$(docker context show)"
          registry_config="$(mktemp -d "$RUNNER_TEMP/people-gator-preview-docker.XXXXXX")"
          echo "path=$registry_config" >> "$GITHUB_OUTPUT"
          # Registry credentials and daemon contexts both live under DOCKER_CONFIG.
          # Preserve only the selected context, without copying existing logins.
          if [ "$preview_context" != default ]; then
            docker context export "$preview_context" "$registry_config/context.dockercontext"
            DOCKER_CONFIG="$registry_config" docker context import "$preview_context" "$registry_config/context.dockercontext"
            rm -- "$registry_config/context.dockercontext"
          fi
          DOCKER_CONFIG="$registry_config" docker context use "$preview_context"
          echo "DOCKER_CONFIG=$registry_config" >> "$GITHUB_ENV"
      - name: Check deployment Docker daemon
        run: |
          docker info --format 'Docker daemon: {{.Name}}'
      - name: Log into image registry
        env:
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Apply staging lifecycle
        run: |
          args=("$OPERATION")
          selected_run="$MANUAL_RUN_ID"
          if [ "$EVENT_NAME" = workflow_run ]; then
            args=(deploy)
            selected_run="$RUN_ID"
          fi
          if [ -n "$selected_run" ]; then args+=(--run-id "$selected_run"); fi
          if [ -n "$EXACT_KEY" ]; then args+=(--exact-key "$EXACT_KEY"); fi
          python3 "$PREVIEW_CONTROLLER" "${args[@]}"
      - name: Remove temporary registry credentials
        if: always() && steps.registry-config.outputs.path != ''
        env:
          PREVIEW_DOCKER_CONFIG: ${{ steps.registry-config.outputs.path }}
        run: rm -rf -- "$PREVIEW_DOCKER_CONFIG"
