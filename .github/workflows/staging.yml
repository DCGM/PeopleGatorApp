name: Main staging deployment

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: update retains staging data; snapshot-init populates it once; refresh replaces it explicitly
        type: choice
        options: [update, snapshot-init, refresh]
        default: update
        required: true
      run_id:
        description: Successful current-main PR CI run ID (empty selects latest successful main run)
        type: string
      exact_key:
        description: Optional exact dated backup key within the configured prefix (snapshot-init/refresh only)
        type: string
      backup_record:
        description: Absolute path of a private host file recording the retained-state backup (refresh only)
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: read

# Staging has its own lock; it shares infrastructure with previews in shared mode.
concurrency:
  group: people-gator-staging
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.workflow_ref == format('{0}/.github/workflows/staging.yml@refs/heads/main', github.repository) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, people-gator-staging]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      OPERATION: ${{ inputs.operation || 'update' }}
      MANUAL_RUN_ID: ${{ inputs.run_id }}
      EXACT_KEY: ${{ inputs.exact_key }}
      BACKUP_RECORD: ${{ inputs.backup_record }}
    steps:
      # Only the reviewed workflow revision is read here, never the PR head.
      - name: Read trusted deployment utility
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-controller
          fetch-depth: 0
          sparse-checkout: deploy
          persist-credentials: false
      - name: Select trusted deployment utility
        id: utility
        run: python3 .deploy-controller/deploy/install.py --user --revision "$GITHUB_WORKFLOW_SHA"
      - name: Check staging configuration and prerequisites
        env:
          DEPLOY: ${{ steps.utility.outputs.executable }}
        run: '"$DEPLOY" staging preflight'
      - name: Apply staging lifecycle
        env:
          DEPLOY: ${{ steps.utility.outputs.executable }}
        run: |
          args=(staging "$OPERATION")
          selected_run="$MANUAL_RUN_ID"
          if [ "$EVENT_NAME" = workflow_run ]; then
            args=(staging update)
            selected_run="$RUN_ID"
          fi
          if [ -n "$selected_run" ]; then args+=(--run-id "$selected_run"); fi
          if [ -n "$EXACT_KEY" ]; then args+=(--exact-key "$EXACT_KEY"); fi
          if [ -n "$BACKUP_RECORD" ]; then args+=(--backup-record "$BACKUP_RECORD"); fi
          "$DEPLOY" "${args[@]}"
